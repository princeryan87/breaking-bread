name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  GODOT_VERSION: "4.3"
  PROJECT_PATH: "."

jobs:
  build-web:
    name: Export Web (HTML5)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      web_artifact: ${{ steps.upload-web.outputs.artifact_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot
        run: |
          # Download Godot 4.3 Linux headless
          GODOT_URL="https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          TEMPLATES_URL="https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"

          mkdir -p ~/.local/share/godot
          cd ~/.local/share/godot

          # Download Godot
          wget -nv -O godot.zip "$GODOT_URL"
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot

          # Download export templates
          wget -nv -O templates.tpz "$TEMPLATES_URL"
          unzip -q templates.tpz
          # Godot expects templates at ~/.local/share/godot/export_templates/<version>/
          mkdir -p export_templates/4.3.stable
          mv templates/* export_templates/4.3.stable/ 2>/dev/null || true

          echo "~/.local/share/godot" >> $GITHUB_PATH

      - name: Export Web
        run: |
          mkdir -v -p web
          godot --headless --export-release "Web" web/index.html

      - name: Upload Web artifact for Pages
        id: upload-web
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/
          name: github-pages

  build-android:
    name: Export Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot
        run: |
          # Download Godot 4.3 Linux headless
          GODOT_URL="https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          TEMPLATES_URL="https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"

          mkdir -p ~/.local/share/godot
          cd ~/.local/share/godot

          # Download Godot
          wget -nv -O godot.zip "$GODOT_URL"
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot

          # Download export templates
          wget -nv -O templates.tpz "$TEMPLATES_URL"
          unzip -q templates.tpz
          # Godot expects templates at ~/.local/share/godot/export_templates/<version>/
          mkdir -p export_templates/4.3.stable
          mv templates/* export_templates/4.3.stable/ 2>/dev/null || true

          echo "~/.local/share/godot" >> $GITHUB_PATH

      - name: Export Android (debug keystore)
        run: |
          mkdir -v -p builds
          godot --headless --export-release "Android" builds/breaking_bread.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: builds/breaking_bread.apk
          retention-days: 30

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4