name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  GODOT_VERSION: 4.3
  PROJECT_PATH: .

jobs:
  build-web:
    name: Build Web (HTML5)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: firebelley/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          export_templates: true

      - name: Build Web Export
        run: |
          mkdir -v -p export/web
          godot --headless --export-release "Web" export/web/index.html

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: export/web/
          retention-days: 7

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: export/web
          force_orphan: true

  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: firebelley/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          export_templates: true

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26c
          emulator: false

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses

      - name: Build Android Export
        run: |
          mkdir -v -p export/android
          godot --headless --export-release "Android" export/android/breaking-bread.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: export/android/breaking-bread.apk
          retention-days: 30

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: firebelley/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Run GUT Tests
        run: |
          godot --headless -s addons/gut/gut_cmdln.gd -gdir=res://tests --no-rendering-loop
        continue-on-error: true